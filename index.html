<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171311"><title>K-POP 粉絲文化入門｜互動簡報</title>
<style>
:root{color-scheme:dark;--bg:#171311;--ink:#f7eee5;--muted:#b9a79a;--accent:#d48b66}*{box-sizing:border-box}body{margin:0;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#352720,#1b1512 58%,#120f0d);color:var(--ink);font-family:Inter,"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;display:flex;flex-direction:column}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,54px);border-bottom:1px solid #ffffff12;flex-shrink:0}.brand{font-size:13px;letter-spacing:.08em}.mark{display:inline-grid;place-items:center;width:25px;height:25px;margin-right:9px;border:1px solid var(--accent);border-radius:50%;color:var(--accent)}.top small{color:var(--muted);letter-spacing:.08em}.stage{flex:1;min-height:0;display:grid;place-items:center;padding:clamp(12px,3vh,30px) clamp(12px,4vw,54px)}.frame{position:relative;width:min(100%,min(88vw,calc((100svh - 168px)*1.7778)));aspect-ratio:16/9;filter:drop-shadow(0 24px 65px #0009);perspective:1400px}.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateX(3%) scale(.985) rotateY(-2deg);transition:opacity .42s ease,transform .55s cubic-bezier(.2,.75,.2,1),visibility .42s;overflow:hidden}.slide img{width:100%;height:100%;object-fit:contain;background:#f3e6d8}.hotspot{position:absolute;z-index:2;padding:0;border:0;background:transparent;cursor:pointer;border-radius:8px;touch-action:pan-y}.hotspot:after{content:"";position:absolute;inset:-5px;border-radius:10px;border:1px solid transparent;background:linear-gradient(110deg,#d48b661c,#fff2 55%,#d48b6614);box-shadow:0 0 0 0 #d48b6600;opacity:0;transform:scale(.985);transition:opacity .22s ease,transform .3s cubic-bezier(.2,.8,.2,1),border-color .22s,box-shadow .3s;pointer-events:none}.hotspot:hover:after,.hotspot:focus-visible:after{opacity:1;transform:scale(1);border-color:#c97d56a8;box-shadow:0 0 20px #b861432b,inset 0 0 18px #d48b6612}.hotspot:focus-visible{outline:none}.hotspot:active:after{background:#d48b6635;transform:scale(1.015)}@media(hover:none){.hotspot{pointer-events:none}}.slide.active{opacity:1;visibility:visible;transform:none}.slide.leave-prev{transform:translateX(-3%) scale(.985) rotateY(2deg);opacity:0}.slide.leave-next{transform:translateX(3%) scale(.985) rotateY(-2deg);opacity:0}.controls{height:82px;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2.5vw,28px);padding:0 14px 8px;flex-shrink:0}.nav{height:45px;min-width:106px;border:1px solid #ffffff25;border-radius:999px;background:#ffffff0a;color:var(--ink);font:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:.2s}.nav:hover:not(:disabled){background:#ffffff17;border-color:#ffffff55;transform:translateY(-1px)}.nav:disabled{opacity:.35;cursor:not-allowed}.nav.primary{background:var(--accent);color:#211713;border-color:var(--accent);font-weight:700}.iconbtn{width:44px;min-width:44px;padding:0;font-size:18px}.status{display:flex;align-items:center;gap:12px;min-width:145px}.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);white-space:nowrap}.count strong{font-size:16px;color:var(--ink)}.progress{width:90px;height:3px;border-radius:9px;background:#ffffff22;overflow:hidden}.progress span{display:block;width:20%;height:100%;background:var(--accent);transition:width .4s}.hint{position:fixed;bottom:15px;right:30px;font-size:11px;color:#9c8b80}.hint kbd{font:inherit;border:1px solid #776458;border-radius:4px;padding:2px 5px;margin:0 2px}.overview{position:fixed;inset:0;z-index:5;background:#120f0eee;backdrop-filter:blur(14px);display:none;overflow:auto;padding:70px clamp(20px,7vw,100px) 44px}.overview.open{display:block;animation:fade .2s}.grid{max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,90vw),1fr));gap:22px}.thumb{border:1px solid #ffffff2b;background:#211a16;padding:5px;cursor:pointer;border-radius:7px;transition:transform .2s,border-color .2s}.thumb:hover{transform:translateY(-4px);border-color:var(--accent)}.thumb.current{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.thumb img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#f3e6d8}.thumb span{display:block;text-align:left;padding:9px 8px 4px;color:#e9dcd1;font-size:13px}.overview-head{max-width:1200px;margin:0 auto 22px;display:flex;justify-content:space-between;align-items:center}.overview-head h2{font-size:20px;font-weight:500;margin:0}.close{position:fixed;top:15px;right:clamp(15px,4vw,55px);z-index:6;width:42px;height:42px;border-radius:50%;border:1px solid #ffffff35;background:#211a16;color:white;font-size:22px;cursor:pointer}@keyframes fade{from{opacity:0}to{opacity:1}}@media(max-width:600px){.top{height:50px}.top small{font-size:10px}.stage{padding:10px}.frame{width:min(100%,calc((100svh - 154px)*1.7778))}.controls{height:76px;gap:8px}.nav{min-width:45px;width:45px;height:43px}.nav .label{display:none}.status{min-width:0;gap:7px}.progress{width:46px}.hint{display:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style></head><body>
<header class="top"><div class="brand"><span class="mark">K</span>K-POP　/　粉絲文化入門</div><small>互動簡報　·　5 頁</small></header>
<main class="stage" aria-label="簡報播放區"><div class="frame" id="frame" aria-live="polite"></div></main>
<footer class="controls" aria-label="簡報控制"><button class="nav iconbtn" id="prev" aria-label="上一頁" title="上一頁（←）">←</button><button class="nav" id="overviewBtn" title="頁面總覽（G）">▦ <span class="label">頁面總覽</span></button><div class="status"><div class="count"><strong id="current">01</strong> / 05</div><div class="progress"><span id="bar"></span></div></div><button class="nav iconbtn" id="fullscreen" aria-label="切換全螢幕" title="全螢幕（F）">⛶</button><button class="nav primary" id="next" aria-label="下一頁" title="下一頁（→）"><span class="label">下一頁</span> →</button></footer>
<div class="hint"><kbd>←</kbd><kbd>→</kbd> 切頁　·　<kbd>G</kbd> 總覽　·　<kbd>F</kbd> 全螢幕</div>
<section class="overview" id="overview" aria-label="所有頁面"><button class="close" id="closeOverview" aria-label="關閉總覽">×</button><div class="overview-head"><h2>選擇頁面</h2><span class="count">共 5 頁</span></div><div class="grid" id="grid"></div></section>
<script>
const titles=['K-pop：從舞台到日常','K-pop 是什麼','粉絲文化','追星日常','快樂與壓力'];
const textZones=[
 [{x:5.5,y:55.5,w:55,h:22,label:'K-pop 主標題'},{x:64.5,y:63,w:29,h:15,label:'從舞台到日常的粉絲文化入門'},{x:6,y:77,w:50,h:7,label:'歌曲・表演・應援・社群'}],
 ...['K-pop 是什麼','粉絲文化','追星日常','快樂與壓力'].map(()=>[{x:5.7,y:25,w:34,h:34,label:'本頁主題'},{x:5.8,y:64,w:32,h:17,label:'本頁摘要'},{x:50,y:25.5,w:39,h:7,label:'重點一標題'},{x:50,y:31.5,w:39,h:9,label:'重點一說明'},{x:50,y:43.5,w:39,h:7,label:'重點二標題'},{x:50,y:49.5,w:39,h:9,label:'重點二說明'},{x:50,y:61.5,w:39,h:7,label:'重點三標題'},{x:50,y:67.5,w:39,h:9,label:'重點三說明'}])
];
const frame=document.querySelector('#frame'),grid=document.querySelector('#grid'),overview=document.querySelector('#overview');let index=0,busy=false,touchX=0;
titles.forEach((title,i)=>{const src=`slides/slide-${String(i+1).padStart(2,'0')}.png`;const el=document.createElement('div');el.className='slide'+(i===0?' active':'');el.setAttribute('aria-hidden',i===0?'false':'true');const img=document.createElement('img');img.src=src;img.alt=title+'，第 '+(i+1)+' 頁';img.draggable=false;el.append(img);textZones[i].forEach(zone=>{const hit=document.createElement("button");hit.type="button";hit.className="hotspot";hit.style.left=zone.x+"%";hit.style.top=zone.y+"%";hit.style.width=zone.w+"%";hit.style.height=zone.h+"%";hit.setAttribute("aria-label","文字互動效果："+zone.label);hit.title=zone.label;el.append(hit)});frame.append(el);const b=document.createElement('button');b.className='thumb'+(i===0?' current':'');b.setAttribute('aria-label',`前往第 ${i+1} 頁：${title}`);b.innerHTML=`<img src="${src}" alt=""><span>${String(i+1).padStart(2,'0')}　${title}</span>`;b.onclick=()=>{go(i);closeGrid()};grid.append(b)});
const pages=[...frame.children],thumbs=[...grid.children];function go(n){if(busy||n===index||n<0||n>=titles.length)return;busy=true;const old=index,dir=n>old?'next':'prev';pages[old].classList.remove('active');pages[old].classList.add('leave-'+dir);pages[old].setAttribute('aria-hidden','true');index=n;pages[index].className='slide active';pages[index].setAttribute('aria-hidden','false');thumbs.forEach((t,i)=>t.classList.toggle('current',i===index));document.querySelector('#current').textContent=String(index+1).padStart(2,'0');document.querySelector('#bar').style.width=((index+1)/titles.length*100)+'%';document.querySelector('#prev').disabled=index===0;document.querySelector('#next').disabled=index===titles.length-1;setTimeout(()=>{pages[old].className='slide';busy=false},580)}
function openGrid(){overview.classList.add('open')}function closeGrid(){overview.classList.remove('open')}document.querySelector('#prev').onclick=()=>go(index-1);document.querySelector('#next').onclick=()=>go(index+1);document.querySelector('#overviewBtn').onclick=openGrid;document.querySelector('#closeOverview').onclick=closeGrid;document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();document.querySelector('#prev').disabled=true;document.querySelector('#bar').style.width='20%';
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey)return;if(overview.classList.contains('open')){if(e.key==='Escape'||e.key.toLowerCase()==='g')closeGrid();return}if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(index+1)}else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(index-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(titles.length-1);else if(e.key.toLowerCase()==='g')openGrid();else if(e.key.toLowerCase()==='f')document.querySelector('#fullscreen').click()});frame.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});frame.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>45)go(index+(dx<0?1:-1))},{passive:true});
</script></body></html>
